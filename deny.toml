[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
# Restricted to discovery and transient public-key verification, with no private-key use.
# Assessments: docs/development/reports/server-discovery-verification.md#dependency-audit-assessment
# and docs/development/reports/recipient-proof-verification.md
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "openidconnect discovery and transient ID-token verification use only public RSA keys, messages and signatures. No private RSA keys, signing or decryption. Reassess any dependency, algorithm or call-path change." },
    { id = "RUSTSEC-2026-0387", reason = "openidconnect discovery and transient RSA/EC signature verification consume public keys, messages and signatures. PKCE/state/nonce do not use these affected secret-integer paths. Reassess any dependency, algorithm, key-source or call-path change." },
]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
# Transitive SDK dependencies can legitimately select more than one compatible major.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
