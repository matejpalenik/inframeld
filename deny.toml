[graph]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
# Approved for public metadata discovery only. Reassess on dependency or crypto-use changes.
# Assessment: docs/development/reports/server-discovery-verification.md#dependency-audit-assessment
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "openidconnect discovery only parses public metadata and keys. No private RSA keys, decryption or signing are used. Reassess before introducing private-key operations." },
    { id = "RUSTSEC-2026-0387", reason = "openidconnect discovery only parses public metadata and keys. No secret-integer arithmetic is used. Reassess before introducing operations on cryptographic secrets." },
]

[licenses]
allow = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0"]

[bans]
# Transitive SDK dependencies can legitimately select more than one compatible major.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
