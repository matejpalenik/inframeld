# Disposable qualification only. No --dev and no public administrative route.
version: v0.13.0
dsn: postgres://kratos_test:kratos-test-only@kratos-postgres:5432/kratos_test?sslmode=disable
serve:
  public:
    base_url: https://inframeld.account.test:8443/
  admin:
    base_url: http://kratos:4434/
oauth2_provider:
  url: http://hydra:4445
selfservice:
  default_browser_return_url: https://inframeld.account.test:8443/
  allowed_return_urls:
    - https://inframeld.account.test:8443/
  methods:
    password:
      enabled: true
      config:
        haveibeenpwned_enabled: true
        haveibeenpwned_host: password-breaches:8443
        max_breaches: 0
        ignore_network_errors: false
    code:
      enabled: true
      passwordless_enabled: true
      config:
        lifespan: 30s
    oidc:
      enabled: true
      config:
        providers:
          - id: company
            provider: generic
            client_id: inframeld-account-oidc
            client_secret: account-ui-oidc-test-only
            issuer_url: https://login.identity.test:8443/inframeld
            mapper_url: file:///etc/oidc.email.jsonnet
            claims_source: id_token
            scope: [openid, email]
    totp:
      enabled: true
    lookup_secret:
      enabled: true
  flows:
    error:
      ui_url: https://inframeld.account.test:8443/error
    login:
      ui_url: https://inframeld.account.test:8443/login
      lifespan: 5m
    logout:
      after:
        default_browser_return_url: https://inframeld.account.test:8443/
    registration:
      enabled: true
      ui_url: https://inframeld.account.test:8443/registration
      after:
        password:
          hooks:
            - hook: session
    settings:
      ui_url: https://inframeld.account.test:8443/settings
    recovery:
      enabled: true
      use: code
      ui_url: https://inframeld.account.test:8443/recovery
    verification:
      enabled: true
      use: code
      ui_url: https://inframeld.account.test:8443/verification
cookies:
  path: /
  same_site: Lax
session:
  lifespan: 8h
  cookie:
    path: /
    same_site: Lax
secrets:
  default: [INFRAMELD-ACCOUNT-TEST-DEFAULT-12345678]
  cookie: [INFRAMELD-ACCOUNT-TEST-COOKIE-12345678]
  cipher: [INFRAMELD-ACCOUNT-CIPHER-1234567]
identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/account/identity.schema.json
courier:
  smtp:
    # Matches the repository's isolated Mailpit STARTTLS fixture.
    connection_uri: smtp://test:test@mailpit:1025/?skip_ssl_verify=true
log:
  level: error
  leak_sensitive_values: false
