[project]
name = "inframeld-sdk-test-fixtures"
version = "0.0.0"
requires-python = ">=3.11"
classifiers = ["Private :: Do Not Upload"]
dependencies = ["httpx==0.28.1", "pydantic>=2.11,<3", "python-dateutil>=2.8.2", "typing-extensions>=4.7.1"]
[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
where = ["generated"]
include = ["inframeld_sdk_fixtures*"]
