[package]
name = "inframeld-sdk-test-rust-capabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unpublished openapi-to-rust fixtures qualification candidate for Inframeld"
publish = false
readme = "README.md"
include = ["generated/**", "Cargo.toml", "README.md", "LICENSE", "NOTICE"]

[lib]
path = "generated/mod.rs"

[dependencies]
bytes = { version = "1", features = ["serde"] }
futures-timer = "3"
futures-util = "0.3"
mime = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["multipart", "query", "rustls", "stream"] }
reqwest-middleware = { version = "0.5", features = ["multipart", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-timer = { version = "3", features = ["wasm-bindgen"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
