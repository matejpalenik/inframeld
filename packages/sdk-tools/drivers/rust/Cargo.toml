[package]
name = "inframeld-sdk-conformance-driver"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
inframeld-sdk = { path = "../../../sdk-rust" }
inframeld-sdk-test-rust = { path = "../../fixtures/rust" }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "multipart", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
base64 = "0.23"
