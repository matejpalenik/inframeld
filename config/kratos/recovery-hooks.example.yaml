# Example only. Render into protected operator configuration, never enable by default.
selfservice:
  flows:
    recovery:
      after:
        hooks:
          - hook: web_hook
            config:
              url: http://recovery-callbacks:8081/internal/v2/identity-recovery/admit
              method: POST
              body: file:///etc/config/kratos/recovery-admit.jsonnet
              can_interrupt: true
              auth:
                type: api_key
                config:
                  name: X-Inframeld-Recovery-Key
                  value: REPLACE_WITH_DEDICATED_PROTECTED_HOOK_KEY
                  in: header
              response:
                ignore: false
                parse: false
          - hook: revoke_active_sessions
    settings:
      before:
        hooks:
          - hook: web_hook
            config:
              url: http://recovery-callbacks:8081/internal/v2/identity-recovery/settings
              method: POST
              body: file:///etc/config/kratos/recovery-settings.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Inframeld-Recovery-Key
                  value: REPLACE_WITH_DEDICATED_PROTECTED_HOOK_KEY
                  in: header
              response:
                ignore: false
                parse: false
      after:
        password:
          hooks:
            - hook: revoke_active_sessions
            - hook: web_hook
              config:
                url: http://recovery-callbacks:8081/internal/v2/identity-recovery/password-saved
                method: POST
                body: file:///etc/config/kratos/recovery-password-saved.jsonnet
                can_interrupt: false
                auth:
                  type: api_key
                  config:
                    name: X-Inframeld-Recovery-Key
                    value: REPLACE_WITH_DEDICATED_PROTECTED_HOOK_KEY
                    in: header
                response:
                  ignore: false
                  parse: false
