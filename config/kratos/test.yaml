# Test-only Kratos configuration. Do not reuse these credentials or secrets in a deployment.
version: v0.13.0
dsn: postgres://kratos_test:kratos-test-only@kratos-postgres:5432/kratos_test?sslmode=disable

serve:
  public:
    base_url: http://kratos:4433/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://kratos:4433/
  methods:
    password:
      enabled: true
    code:
      enabled: true
    oidc:
      enabled: true
      config:
        providers:
          - id: company
            provider: generic
            client_id: inframeld-kratos-test
            client_secret: test-only-client-secret
            issuer_url: http://mock-oidc:8080/inframeld
            mapper_url: file:///etc/config/kratos/oidc.email.jsonnet
            claims_source: id_token
            scope:
              - openid
              - email
  flows:
    error:
      ui_url: http://kratos:4433/error
    login:
      ui_url: http://kratos:4433/login
    registration:
      ui_url: http://kratos:4433/registration
      after:
        password:
          hooks:
            - hook: session
        oidc:
          hooks:
            - hook: session
    settings:
      ui_url: http://kratos:4433/settings
    recovery:
      enabled: true
      use: code
      ui_url: http://kratos:4433/recovery
      after:
        hooks:
          - hook: web_hook
            config:
              url: http://recovery-hooks:8080/internal/v1/identity-recovery/admit
              method: POST
              body: file:///etc/config/kratos/test-recovery-admit.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Inframeld-Recovery-Key
                  value: inframeld-recovery-hook-test-only
                  in: header
              response:
                ignore: false
                parse: false
          - hook: revoke_active_sessions
          - hook: web_hook
            config:
              url: http://recovery-hooks:8080/internal/v1/identity-recovery/complete
              method: POST
              body: file:///etc/config/kratos/test-recovery-complete.jsonnet
              auth:
                type: api_key
                config:
                  name: X-Inframeld-Recovery-Key
                  value: inframeld-recovery-hook-test-only
                  in: header
              response:
                ignore: false
                parse: false

secrets:
  default:
    - INFRAMELD-TEST-ONLY-CHANGE-ME-12345678
  cookie:
    - INFRAMELD-TEST-COOKIE-SECRET-12345678
  cipher:
    - INFRAMELD-TEST-CIPHER-SECRET-123

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://test:test@mailpit:1025/?skip_ssl_verify=true
