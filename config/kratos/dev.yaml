# Local development only. Use deployment-specific credentials and secrets outside development.
version: v0.13.0
dsn: postgres://kratos_dev:kratos-dev-only@kratos-postgres:5432/kratos_dev?sslmode=disable

serve:
  public:
    base_url: http://127.0.0.1:14434/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:14434/
  methods:
    password:
      enabled: true
  flows:
    error:
      ui_url: http://127.0.0.1:14434/error
    login:
      ui_url: http://127.0.0.1:14434/login
    registration:
      ui_url: http://127.0.0.1:14434/registration
      after:
        password:
          hooks:
            - hook: session
    settings:
      ui_url: http://127.0.0.1:14434/settings

secrets:
  default:
    - INFRAMELD-DEV-ONLY-CHANGE-ME-12345678
  cookie:
    - INFRAMELD-DEV-COOKIE-SECRET-12345678
  cipher:
    - INFRAMELD-DEV-CIPHER-SECRET-1234

identity:
  default_schema_id: default
  schemas:
    - id: default
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtps://dev:dev@127.0.0.1:1025/?skip_ssl_verify=true
