name: Feature request
description: Propose a focused improvement to Inframeld
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or developer problem would this solve?
      placeholder: As a ..., I need ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful solution and its boundaries.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches or workarounds did you consider?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: I have checked the architecture specification and existing ADRs.
          required: true
        - label: I have searched existing issues and pull requests.
          required: true
