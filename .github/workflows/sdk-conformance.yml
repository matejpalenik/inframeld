name: SDK conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Include macOS qualification
        type: boolean
        default: true

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml
    with:
      macos: ${{ github.event_name != 'workflow_dispatch' || inputs.macos }}

  verify:
    needs: changes
    if: needs.changes.outputs.sdk == 'true'
    name: ${{ matrix.language }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.sdk_matrix) }}
    env:
      INFRAMELD_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Select job-local SDK tool cache
        run: printf 'INFRAMELD_SDK_TOOLS_DIR=%s/inframeld-sdk-tools\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: "12.4.0"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.6.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/sdk-tools/package.json
      - name: Set up uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.12.15"
          python-version: "3.13.12"
          enable-cache: true
          cache-local-path: ${{ env.INFRAMELD_SDK_TOOLS_DIR }}/uv
          cache-suffix: sdk-${{ matrix.language }}
          cache-dependency-glob: |
            apps/backend/pyproject.toml
            apps/backend/uv.lock
            packages/sdk-tools/pyproject.toml
            packages/sdk-tools/requirements.lock
            packages/sdk-python/pyproject.toml
            packages/sdk-tools/fixtures/python/pyproject.toml
      - name: Install pinned Python
        run: |
          uv python install 3.13.12
          python_executable="$(uv python find --managed-python 3.13.12)"
          dirname "$python_executable" >> "$GITHUB_PATH"
      - name: Provision test fingerprint key
        run: |
          umask 077
          key_file="$RUNNER_TEMP/idempotency-fingerprint-hmac.key"
          python - "$key_file" <<'PY'
          import secrets
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(secrets.token_bytes(32))
          PY
          printf 'INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        if: matrix.language == 'python'
        with:
          distribution: temurin
          java-version: "25.0.2"
      - name: Install pinned dependencies
        run: |
          pnpm install --frozen-lockfile
          cp apps/backend/.env.test.example apps/backend/.env.test
          uv sync --project apps/backend --locked
      - name: Set up pinned Rust
        if: matrix.language == 'rust'
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependencies and pinned generator
        if: matrix.language == 'rust'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: inframeld-rust-v1
          key: sdk-${{ matrix.os }}-${{ hashFiles('Cargo.toml', '.github/workflows/sdk-conformance.yml', 'packages/sdk-tools/generators/**', 'packages/sdk-tools/src/generation/**', 'packages/sdk-tools/src/system/**', 'packages/sdk-tools/src/config.ts') }}
          cache-bin: false
          cache-all-crates: true
          cache-workspace-crates: false
          cache-directories: ${{ env.INFRAMELD_SDK_TOOLS_DIR }}/selected/rust
      - name: Restore original generator archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.INFRAMELD_SDK_TOOLS_DIR }}/*.crate
            ${{ env.INFRAMELD_SDK_TOOLS_DIR }}/*.tgz
            ${{ env.INFRAMELD_SDK_TOOLS_DIR }}/*.jar
          key: sdk-sources-v1-${{ matrix.os }}-${{ runner.arch }}-${{ matrix.language }}-${{ hashFiles('packages/sdk-tools/generators/**') }}
      - name: Prepare selected SDK tools
        run: pnpm sdk:setup ${{ matrix.language }}
      - name: Install Linux browser dependencies
        if: matrix.language == 'typescript' && runner.os == 'Linux'
        run: pnpm --filter @inframeld/sdk-tools exec playwright install-deps chromium
      - name: Check backend HTTP contracts and witnesses
        run: uv run --directory apps/backend pytest tests/unit/contract
      - name: Verify selected SDK
        run: pnpm sdk:verify ${{ matrix.language }}
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.language }}-${{ matrix.os }}
          path: packages/sdk-tools/artifacts/
          if-no-files-found: error

  conformance:
    name: SDK conformance
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-26.04
    env:
      CHANGES: ${{ needs.changes.result }}
      RELEVANT: ${{ needs.changes.outputs.sdk }}
      VERIFICATION: ${{ needs.verify.result }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.sdk == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.sdk == 'true'
        with:
          version: "12.4.0"
          run_install: false
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.sdk == 'true'
        with:
          node-version: "26.6.0"
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            packages/sdk-tools/package.json
      - name: Install evidence reader dependencies
        if: needs.changes.outputs.sdk == 'true'
        run: pnpm install --frozen-lockfile --filter '@inframeld/sdk-tools...'
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.sdk == 'true'
        with:
          pattern: sdk-*
          path: sdk-evidence
      - name: Inspect complete evidence
        if: needs.changes.outputs.sdk == 'true'
        env:
          REQUIRE_MACOS: ${{ needs.changes.outputs.sdk_macos }}
        run: |
          case "$REQUIRE_MACOS" in true|false) ;; *) exit 1 ;; esac
          node --import ./packages/sdk-tools/node_modules/tsx/dist/loader.mjs packages/sdk-tools/src/ci/evidence.ts sdk-evidence "$REQUIRE_MACOS"
      - name: Require every applicable SDK check
        run: |
          test "$CHANGES" = success
          case "$RELEVANT" in true|false) ;; *) exit 1 ;; esac
          if [ "$RELEVANT" = true ]; then
            test "$VERIFICATION" = success
          else
            echo 'No SDK/API-affecting changes. SDK verification was not required.'
          fi
