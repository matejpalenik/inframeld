name: SDK conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      macos:
        description: Include macOS qualification
        type: boolean
        default: true

permissions:
  contents: read

env:
  HUSKY: "0"

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
      macos: ${{ steps.changes.outputs.macos }}
      matrix: ${{ steps.changes.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
          MACOS: ${{ inputs.macos }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import subprocess
          event = os.environ['EVENT']
          base = os.environ.get('BASE', '')
          if event == 'workflow_dispatch' or not base or set(base) == {'0'}:
              relevant = True
              macos = event != 'workflow_dispatch' or os.environ.get('MACOS') == 'true'
          else:
              paths = subprocess.check_output(['git', 'diff', '--name-only', base, os.environ['HEAD']], text=True).splitlines()
              relevant = any(p.startswith(('packages/sdk-', 'apps/backend/', 'contracts/openapi/', '.github/workflows/sdk-')) or p in ('package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml', 'mise.toml') for p in paths)
              macos = any(p.startswith(('packages/sdk-tools/generators/', 'packages/sdk-tools/src/generation/', 'packages/sdk-tools/src/system/', 'packages/sdk-tools/src/conformance/', 'packages/sdk-tools/drivers/', 'packages/sdk-tools/consumers/', 'packages/sdk-tools/tests/native/', 'packages/sdk-tools/tests/unit/process.test.ts', 'packages/sdk-tools/tests/unit/backend.test.ts', 'packages/sdk-tools/tests/conformance/transport.ts')) or p in ('.github/workflows/sdk-conformance.yml', 'pnpm-workspace.yaml', 'packages/sdk-tools/src/workflows/generate.ts', 'packages/sdk-tools/requirements.in', 'packages/sdk-tools/requirements.lock', 'packages/sdk-tools/package.json', 'packages/sdk-rust/Cargo.toml', 'packages/sdk-python/pyproject.toml', 'packages/sdk-typescript/package.json', 'rust-toolchain.toml', 'mise.toml') for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'relevant={str(relevant).lower()}\nmacos={str(macos).lower()}\n')
              matrix = {'include': [{'language': language, 'os': platform} for language in ('rust', 'typescript', 'python') for platform in ('ubuntu-24.04', 'macos-15') if platform == 'ubuntu-24.04' or macos]}
              output.write('matrix=' + json.dumps(matrix) + '\n')
          PY
  verify:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    name: ${{ matrix.language }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      INFRAMELD_ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: "12.4.0"
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "26.6.0"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13.12"
      - name: Provision test fingerprint key
        run: |
          umask 077
          key_file="$RUNNER_TEMP/idempotency-fingerprint-hmac.key"
          python - "$key_file" <<'PY'
          import secrets
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(secrets.token_bytes(32))
          PY
          printf 'INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
        with:
          version: "0.12.15"
      - uses: actions/setup-java@v6
        if: matrix.language == 'python'
        with:
          distribution: temurin
          java-version: "25.0.2"
      - name: Install pinned dependencies
        run: |
          pnpm install --frozen-lockfile
          cp apps/backend/.env.test.example apps/backend/.env.test
          uv sync --project apps/backend --locked
          if [ '${{ matrix.language }}' = rust ]; then
            rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          fi
          pnpm sdk:setup ${{ matrix.language }}
      - name: Install Linux browser dependencies
        if: matrix.language == 'typescript' && runner.os == 'Linux'
        run: pnpm --filter @inframeld/sdk-tools exec playwright install-deps chromium
      - name: Check backend HTTP contracts and witnesses
        run: uv run --directory apps/backend pytest tests/unit/contract
      - name: Verify selected SDK
        run: pnpm sdk:verify ${{ matrix.language }}
      - name: Preserve results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sdk-${{ matrix.language }}-${{ matrix.os }}
          path: packages/sdk-tools/artifacts/
          if-no-files-found: error

  conformance:
    name: SDK conformance
    if: always()
    needs: [changes, verify]
    runs-on: ubuntu-24.04
    env:
      CHANGES: ${{ needs.changes.result }}
      RELEVANT: ${{ needs.changes.outputs.relevant }}
      VERIFICATION: ${{ needs.verify.result }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.relevant == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: needs.changes.outputs.relevant == 'true'
        with:
          node-version: "26.6.0"
      - uses: pnpm/action-setup@v6
        if: needs.changes.outputs.relevant == 'true'
        with:
          version: "12.4.0"
          run_install: false
      - name: Install evidence reader dependencies
        if: needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile --filter '@inframeld/sdk-tools...'
      - uses: actions/download-artifact@v8
        if: needs.changes.outputs.relevant == 'true'
        with:
          pattern: sdk-*
          path: sdk-evidence
      - name: Inspect complete evidence
        if: needs.changes.outputs.relevant == 'true'
        env:
          REQUIRE_MACOS: ${{ needs.changes.outputs.macos }}
        run: node --import ./packages/sdk-tools/node_modules/tsx/dist/loader.mjs packages/sdk-tools/src/ci/evidence.ts sdk-evidence "$REQUIRE_MACOS"
      - name: Require every applicable SDK check
        run: |
          test "$CHANGES" = success
          if [ "$RELEVANT" = true ]; then
            test "$VERIFICATION" = success
          else
            echo 'No SDK/API-affecting changes. SDK verification was not required.'
          fi
