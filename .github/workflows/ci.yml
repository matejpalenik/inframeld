name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  NODE_VERSION: "26.6.0"
  PNPM_VERSION: "12.4.0"
  PYTHON_VERSION: "3.13.12"
  UV_VERSION: "0.12.15"
  INFRAMELD_ENVIRONMENT: test
  INFRAMELD_LOG_LEVEL: INFO
  INFRAMELD_LOG_FORMAT: console
  INFRAMELD_DATABASE__HOST: 127.0.0.1
  INFRAMELD_DATABASE__PORT: "5432"
  INFRAMELD_DATABASE__NAME: ci
  INFRAMELD_DATABASE__USER: ci
  INFRAMELD_DATABASE__PASSWORD: ci-only-not-used

jobs:
  backend:
    name: Backend foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ci
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-used
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U ci -d ci" --health-interval 5s --health-timeout 5s --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare backend test configuration
        run: cp apps/backend/.env.test.example apps/backend/.env.test

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install backend check dependencies
        run: pnpm install --filter inframeld --filter @inframeld/backend --frozen-lockfile

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/pyproject.toml
            apps/backend/uv.lock

      - name: Check uv lockfile
        run: uv lock --check --project apps/backend

      - name: Install Python dependencies
        run: uv sync --project apps/backend --locked

      - name: Run backend-only checks
        run: pnpm check:backend

      - name: Apply PostgreSQL migrations
        run: pnpm --filter @inframeld/backend migrate

      - name: Run PostgreSQL integration tests
        env:
          INFRAMELD_RUN_DB_INTEGRATION: "1"
        run: uv run --project apps/backend pytest apps/backend/tests/integration -q

  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare backend test configuration
        run: cp apps/backend/.env.test.example apps/backend/.env.test

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/pyproject.toml
            apps/backend/uv.lock

      - name: Verify toolchain versions
        run: |
          node --version
          pnpm --version
          python --version
          uv --version

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check uv lockfile
        run: uv lock --check --project apps/backend

      - name: Install Python dependencies
        run: uv sync --project apps/backend --locked

      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git log -1 --format=%B | pnpm exec commitlint
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Check OpenAPI drift
        run: pnpm openapi:check

      - name: Build
        run: pnpm build
