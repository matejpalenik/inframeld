name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  NODE_VERSION: "26.6.0"
  PNPM_VERSION: "12.4.0"
  PYTHON_VERSION: "3.13.12"
  UV_VERSION: "0.12.15"
  INFRAMELD_ENVIRONMENT: test
  INFRAMELD_LOG_LEVEL: INFO
  INFRAMELD_LOG_FORMAT: console

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  quality:
    name: Quality
    needs: changes
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CHANGES: ${{ needs.changes.result }}
      BACKEND: ${{ needs.changes.outputs.backend }}
      WEB: ${{ needs.changes.outputs.web }}
      WEB_FORMAT: ${{ needs.changes.outputs.web_format }}
      DOCS: ${{ needs.changes.outputs.docs }}
      DOCS_FORMAT: ${{ needs.changes.outputs.docs_format }}
      DELIVERY: ${{ needs.changes.outputs.delivery }}
      CLI: ${{ needs.changes.outputs.cli }}
      SDK: ${{ needs.changes.outputs.sdk }}
      UV_LOCKED: "1"
    steps:
      - name: Require valid selection
        run: |
          test "$CHANGES" = success
          for selected in "$BACKEND" "$WEB" "$WEB_FORMAT" "$DOCS" "$DOCS_FORMAT" "$DELIVERY" "$CLI" "$SDK"; do
            case "$selected" in true|false) ;; *) exit 1 ;; esac
          done
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies for selected packages
        run: |
          filters=(--filter inframeld)
          if [ "$BACKEND" = true ]; then filters+=(--filter @inframeld/backend); fi
          if [ "$WEB" = true ] || [ "$WEB_FORMAT" = true ]; then filters+=(--filter @inframeld/web); fi
          if [ "$DOCS" = true ] || [ "$DOCS_FORMAT" = true ]; then filters+=(--filter @inframeld/docs); fi
          if [ "$CLI" = true ]; then filters+=(--filter @inframeld/cli); fi
          if [ "$SDK" = true ]; then filters+=(--filter '@inframeld/sdk-tools...'); fi
          pnpm install --frozen-lockfile "${filters[@]}"
      - name: Prepare backend test configuration
        if: needs.changes.outputs.backend == 'true'
        run: cp apps/backend/.env.test.example apps/backend/.env.test
      - name: Set up uv
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/pyproject.toml
            apps/backend/uv.lock
      - name: Install pinned Python
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        run: |
          uv python install "$PYTHON_VERSION"
          python_executable="$(uv python find --managed-python "$PYTHON_VERSION")"
          dirname "$python_executable" >> "$GITHUB_PATH"
      - name: Provision test fingerprint key
        if: needs.changes.outputs.backend == 'true'
        run: |
          umask 077
          key_file="$RUNNER_TEMP/idempotency-fingerprint-hmac.key"
          python - "$key_file" <<'PYKEY'
          import secrets
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(secrets.token_bytes(32))
          PYKEY
          printf 'INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
      - name: Check uv lockfile and install Python dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        run: |
          uv lock --check --project apps/backend
          uv sync --project apps/backend --locked
      - name: Set up pinned Rust for CLI checks
        if: needs.changes.outputs.cli == 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependencies for CLI checks
        if: needs.changes.outputs.cli == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: inframeld-rust-v1
          key: quality-ubuntu-26.04-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [ "$EVENT_NAME" = workflow_dispatch ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git log -1 --format=%B | pnpm exec commitlint
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
          fi

      - name: Check repository formatting
        run: |
          arguments=(--check --ignore-unknown .)
          if [ "$WEB" != true ] && [ "$WEB_FORMAT" != true ]; then arguments+=('!apps/web/**'); fi
          if [ "$DOCS" != true ] && [ "$DOCS_FORMAT" != true ]; then arguments+=('!apps/docs/**'); fi
          pnpm exec prettier "${arguments[@]}"
      - name: Run backend fast checks and build
        if: needs.changes.outputs.backend == 'true'
        run: |
          pnpm check:backend
          pnpm --filter @inframeld/backend build
      - name: Check CI helper quality
        if: needs.changes.outputs.backend == 'true'
        run: |
          uv run --project apps/backend ruff format --check --config apps/backend/pyproject.toml .github/scripts
          uv run --project apps/backend ruff check --config apps/backend/pyproject.toml .github/scripts
          uv run --project apps/backend pyright --project .github/scripts/pyrightconfig.json
      - name: Check delivery helper quality
        if: needs.changes.outputs.delivery == 'true'
        run: |
          uv run --project apps/backend ruff format --check --config apps/backend/pyproject.toml scripts/delivery
          uv run --project apps/backend ruff check --config apps/backend/pyproject.toml scripts/delivery
          uv run --project apps/backend pyright --project scripts/delivery/pyrightconfig.json
      - name: Test delivery coordination helpers
        run: pnpm delivery:test
      - name: Run web checks and build
        if: needs.changes.outputs.web == 'true'
        run: |
          pnpm --filter @inframeld/web lint
          pnpm --filter @inframeld/web typecheck
          pnpm --filter @inframeld/web build
      - name: Run CLI fast checks and build
        if: needs.changes.outputs.cli == 'true'
        run: |
          pnpm --filter @inframeld/cli format:check
          pnpm --filter @inframeld/cli lint
          pnpm --filter @inframeld/cli typecheck
          pnpm --filter @inframeld/cli test
          pnpm --filter @inframeld/cli build
      - name: Run documentation checks and build
        if: needs.changes.outputs.docs == 'true'
        run: pnpm check:docs
      - name: Run SDK tooling checks and TypeScript build
        if: needs.changes.outputs.sdk == 'true'
        run: |
          pnpm --filter @inframeld/sdk-tools typecheck
          pnpm --filter @inframeld/sdk-tools test
          pnpm --filter @inframeld/sdk typecheck
          pnpm --filter @inframeld/sdk build
      - name: Report documentation-only quality scope
        if: needs.changes.outputs.backend == 'false' && needs.changes.outputs.web == 'false' && needs.changes.outputs.docs == 'false' && needs.changes.outputs.cli == 'false' && needs.changes.outputs.sdk == 'false'
        run: echo 'Application checks were not required. Formatting, commit and delivery helper tests applied.' >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend foundation
    needs: [changes, quality]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      CHANGES: ${{ needs.changes.result }}
      INTEGRATION: ${{ needs.changes.outputs.integration }}
      QUALITY: ${{ needs.quality.result }}
    steps:
      - name: Require valid selection and prerequisite checks
        run: |
          test "$CHANGES" = success
          case "$INTEGRATION" in true|false) ;; *) exit 1 ;; esac
          if [ "$INTEGRATION" = true ]; then
            test "$QUALITY" = success
          else
            echo 'No integration inputs changed. Backend integration is not applicable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out repository
        if: needs.changes.outputs.integration == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: needs.changes.outputs.integration == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        if: needs.changes.outputs.integration == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/backend/package.json
      - name: Install integration command dependencies
        if: needs.changes.outputs.integration == 'true'
        run: pnpm install --filter inframeld --filter @inframeld/backend --frozen-lockfile
      - name: Set up Docker Buildx
        if: needs.changes.outputs.integration == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and cache integration image
        if: needs.changes.outputs.integration == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile.integration
          load: true
          push: false
          pull: true
          tags: localhost/inframeld-integration-tests:ci
          cache-from: type=gha,version=2,scope=inframeld-integration-linux-amd64,timeout=2m
          # Main populates the shared cache. Pull requests only restore it.
          # This single-stage image needs only the final image's cache layers.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,version=2,scope=inframeld-integration-linux-amd64,mode=min,ignore-error=true,timeout=2m' || '' }}

      - name: Run backend integration tests with PostgreSQL, Kratos and Hydra
        if: needs.changes.outputs.integration == 'true'
        id: integration
        env:
          INFRAMELD_CONTAINER_RUNTIME: docker
          INFRAMELD_INTEGRATION_IMAGE: localhost/inframeld-integration-tests:ci
        run: pnpm test:integration

      - name: Verify integration teardown
        if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' && steps.integration.outcome != 'skipped' && steps.integration.outcome != '' }}
        run: |
          set -euo pipefail
          containers="$(docker ps -aq --filter label=com.docker.compose.project=inframeld-test)"
          networks="$(docker network ls -q --filter label=com.docker.compose.project=inframeld-test)"
          if [[ -n "$containers" || -n "$networks" ]]; then
            printf 'Integration containers or networks survived teardown.\n' >&2
            exit 1
          fi
          volumes="$(docker volume ls --format '{{.Name}}')"
          for volume in inframeld_test_tls_trust inframeld_test_tls_identity; do
            case $'\n'"$volumes"$'\n' in
              *$'\n'"$volume"$'\n'*)
                printf 'Disposable TLS volume survived teardown: %s\n' "$volume" >&2
                exit 1
                ;;
            esac
          done
          docker volume inspect inframeld_test_postgres_data inframeld_test_kratos_postgres_data >/dev/null
