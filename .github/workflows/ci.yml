name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      parser_sandbox_only:
        description: Run only the reviewed Ubuntu parser sandbox probe
        type: boolean
        default: false
      parser_sandbox_sha:
        description: Exact reviewed commit for the parser sandbox probe
        type: string
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only && '-parser-sandbox' || '' }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  NODE_VERSION: "26.6.0"
  PNPM_VERSION: "12.4.0"
  PYTHON_VERSION: "3.13.12"
  UV_VERSION: "0.12.15"
  INFRAMELD_ENVIRONMENT: test
  INFRAMELD_LOG_LEVEL: INFO
  INFRAMELD_LOG_FORMAT: console

jobs:
  changes:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only) }}
    uses: ./.github/workflows/changes.yml

  quality:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only && 'Quality (outside parser probe)' || 'Quality' }}
    needs: changes
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    env:
      CHANGES: ${{ needs.changes.result }}
      BACKEND: ${{ needs.changes.outputs.backend }}
      WEB: ${{ needs.changes.outputs.web }}
      WEB_FORMAT: ${{ needs.changes.outputs.web_format }}
      DOCS: ${{ needs.changes.outputs.docs }}
      DOCS_FORMAT: ${{ needs.changes.outputs.docs_format }}
      DELIVERY: ${{ needs.changes.outputs.delivery }}
      CLI: ${{ needs.changes.outputs.cli }}
      SDK: ${{ needs.changes.outputs.sdk }}
      UV_LOCKED: "1"
    steps:
      - name: Require valid selection
        run: |
          test "$CHANGES" = success
          for selected in "$BACKEND" "$WEB" "$WEB_FORMAT" "$DOCS" "$DOCS_FORMAT" "$DELIVERY" "$CLI" "$SDK"; do
            case "$selected" in true|false) ;; *) exit 1 ;; esac
          done
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies for selected packages
        run: |
          filters=(--filter inframeld)
          if [ "$BACKEND" = true ]; then filters+=(--filter @inframeld/backend); fi
          if [ "$WEB" = true ]; then
            filters+=(--filter '@inframeld/web...')
          elif [ "$WEB_FORMAT" = true ]; then
            filters+=(--filter @inframeld/web)
          fi
          if [ "$DOCS" = true ] || [ "$DOCS_FORMAT" = true ]; then filters+=(--filter @inframeld/docs); fi
          if [ "$CLI" = true ]; then filters+=(--filter @inframeld/cli); fi
          if [ "$SDK" = true ]; then filters+=(--filter '@inframeld/sdk-tools...'); fi
          pnpm install --frozen-lockfile "${filters[@]}"
      - name: Prepare backend test configuration
        if: needs.changes.outputs.backend == 'true'
        run: cp apps/backend/.env.test.example apps/backend/.env.test
      - name: Set up uv
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            apps/backend/pyproject.toml
            apps/backend/uv.lock
      - name: Install pinned Python
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        run: |
          uv python install "$PYTHON_VERSION"
          python_executable="$(uv python find --managed-python "$PYTHON_VERSION")"
          dirname "$python_executable" >> "$GITHUB_PATH"
      - name: Provision test fingerprint key
        if: needs.changes.outputs.backend == 'true'
        run: |
          umask 077
          key_file="$RUNNER_TEMP/idempotency-fingerprint-hmac.key"
          python - "$key_file" <<'PYKEY'
          import secrets
          import sys
          from pathlib import Path

          Path(sys.argv[1]).write_bytes(secrets.token_bytes(32))
          PYKEY
          printf 'INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE=%s\n' "$key_file" >> "$GITHUB_ENV"
      - name: Check uv lockfile and install Python dependencies
        if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.delivery == 'true'
        run: |
          uv lock --check --project apps/backend
          uv sync --project apps/backend --locked
      - name: Set up pinned Rust for CLI checks
        if: needs.changes.outputs.cli == 'true'
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
      - name: Restore Rust dependencies for CLI checks
        if: needs.changes.outputs.cli == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: inframeld-rust-v1
          key: quality-ubuntu-26.04-${{ hashFiles('Cargo.toml', '.github/workflows/ci.yml') }}
          cache-bin: false
          cache-workspace-crates: false
      - name: Validate commit messages
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          elif [ "$EVENT_NAME" = workflow_dispatch ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            git log -1 --format=%B | pnpm exec commitlint
          else
            pnpm exec commitlint --from "$BEFORE_SHA" --to "$AFTER_SHA" --verbose
          fi

      - name: Check repository formatting
        run: |
          arguments=(--check --ignore-unknown .)
          if [ "$WEB" != true ] && [ "$WEB_FORMAT" != true ]; then arguments+=('!apps/web/**'); fi
          if [ "$DOCS" != true ] && [ "$DOCS_FORMAT" != true ]; then arguments+=('!apps/docs/**'); fi
          pnpm exec prettier "${arguments[@]}"
      - name: Run backend fast checks and build
        if: needs.changes.outputs.backend == 'true'
        run: |
          pnpm check:backend
          pnpm --filter @inframeld/backend build
      - name: Check CI helper quality
        if: needs.changes.outputs.backend == 'true'
        run: |
          uv run --project apps/backend ruff format --check --config apps/backend/pyproject.toml .github/scripts
          uv run --project apps/backend ruff check --config apps/backend/pyproject.toml .github/scripts
          uv run --project apps/backend pyright --project .github/scripts/pyrightconfig.json
      - name: Check delivery helper quality
        if: needs.changes.outputs.delivery == 'true'
        run: |
          uv run --project apps/backend ruff format --check --config apps/backend/pyproject.toml scripts/delivery
          uv run --project apps/backend ruff check --config apps/backend/pyproject.toml scripts/delivery
          uv run --project apps/backend pyright --project scripts/delivery/pyrightconfig.json
      - name: Test delivery coordination helpers
        run: pnpm delivery:test
      - name: Run web checks and build
        if: needs.changes.outputs.web == 'true'
        run: |
          pnpm --filter @inframeld/web lint
          pnpm --filter @inframeld/web typecheck
          pnpm --filter @inframeld/web build
      - name: Run CLI fast checks and build
        if: needs.changes.outputs.cli == 'true'
        run: |
          pnpm --filter @inframeld/cli format:check
          pnpm --filter @inframeld/cli lint
          pnpm --filter @inframeld/cli typecheck
          pnpm --filter @inframeld/cli test
          pnpm --filter @inframeld/cli build
      - name: Run documentation checks and build
        if: needs.changes.outputs.docs == 'true'
        run: pnpm check:docs
      - name: Run SDK tooling checks and TypeScript build
        if: needs.changes.outputs.sdk == 'true'
        run: |
          pnpm --filter @inframeld/sdk-tools typecheck
          pnpm --filter @inframeld/sdk-tools test
          pnpm --filter @inframeld/sdk typecheck
          pnpm --filter @inframeld/sdk build
      - name: Report documentation-only quality scope
        if: needs.changes.outputs.backend == 'false' && needs.changes.outputs.web == 'false' && needs.changes.outputs.docs == 'false' && needs.changes.outputs.cli == 'false' && needs.changes.outputs.sdk == 'false'
        run: echo 'Application checks were not required. Formatting, commit and delivery helper tests applied.' >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only && 'Backend foundation (outside parser probe)' || 'Backend foundation' }}
    needs: [changes, quality]
    if: ${{ !cancelled() && !(github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 95
    env:
      CHANGES: ${{ needs.changes.result }}
      INTEGRATION: ${{ needs.changes.outputs.integration }}
      QUALITY: ${{ needs.quality.result }}
    steps:
      - name: Require valid selection and prerequisite checks
        run: |
          test "$CHANGES" = success
          case "$INTEGRATION" in true|false) ;; *) exit 1 ;; esac
          if [ "$INTEGRATION" = true ]; then
            test "$QUALITY" = success
          else
            echo 'No integration inputs changed. Backend integration is not applicable.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Check out repository
        if: needs.changes.outputs.integration == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up pnpm
        if: needs.changes.outputs.integration == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - name: Set up Node.js
        if: needs.changes.outputs.integration == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/backend/package.json
      - name: Install integration command dependencies
        if: needs.changes.outputs.integration == 'true'
        run: pnpm install --filter inframeld --filter @inframeld/backend --frozen-lockfile
      - name: Set up Docker Buildx
        if: needs.changes.outputs.integration == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and cache integration image
        if: needs.changes.outputs.integration == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/backend/Dockerfile.integration
          load: true
          push: false
          pull: true
          tags: localhost/inframeld-integration-tests:ci
          cache-from: type=gha,version=2,scope=inframeld-integration-linux-amd64,timeout=2m
          # Main populates the shared cache. Pull requests only restore it.
          # This single-stage image needs only the final image's cache layers.
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'type=gha,version=2,scope=inframeld-integration-linux-amd64,mode=min,ignore-error=true,timeout=2m' || '' }}

      - name: Prepare pinned SeaweedFS image
        if: needs.changes.outputs.integration == 'true'
        run: docker compose -p inframeld-test -f compose.test.yaml pull --policy always seaweedfs

      - name: Run backend integration tests with PostgreSQL, Kratos and Hydra
        if: needs.changes.outputs.integration == 'true'
        id: integration
        env:
          INFRAMELD_CONTAINER_RUNTIME: docker
          INFRAMELD_INTEGRATION_IMAGE: localhost/inframeld-integration-tests:ci
          INFRAMELD_TEST_NORMAL_WORK_SECONDS: "5400"
        run: pnpm test:integration tests/integration --durations=20

      - name: Verify integration teardown
        if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' && steps.integration.outcome != 'skipped' && steps.integration.outcome != '' }}
        run: |
          set -euo pipefail
          containers="$(docker ps -aq --filter label=com.docker.compose.project=inframeld-test)"
          networks="$(docker network ls -q --filter label=com.docker.compose.project=inframeld-test)"
          if [[ -n "$containers" || -n "$networks" ]]; then
            printf 'Integration containers or networks survived teardown.\n' >&2
            exit 1
          fi
          volumes="$(docker volume ls --format '{{.Name}}')"
          for volume in inframeld_test_tls_trust inframeld_test_tls_identity; do
            case $'\n'"$volumes"$'\n' in
              *$'\n'"$volume"$'\n'*)
                printf 'Disposable TLS volume survived teardown: %s\n' "$volume" >&2
                exit 1
                ;;
            esac
          done
          docker volume inspect inframeld_test_postgres_data inframeld_test_kratos_postgres_data >/dev/null

  parser-sandbox:
    name: Ubuntu parser sandbox probe
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.parser_sandbox_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the reviewed Inframeld branch commit
        env:
          REVIEWED_SHA: ${{ inputs.parser_sandbox_sha }}
        run: |
          test "$GITHUB_REPOSITORY" = matejpalenik/inframeld
          test "$GITHUB_REF_TYPE" = branch
          test "$REVIEWED_SHA" = "$GITHUB_SHA"
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Exercise the fixed child on stock Docker and enforcing AppArmor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = x86_64
          . /etc/os-release
          test "$ID/$VERSION_ID" = ubuntu/24.04
          test "$(cat /sys/module/apparmor/parameters/enabled)" = Y
          test -z "${DOCKER_HOST:-}"
          test "$(docker context show)" = default
          test "$(docker info --format '{{.CgroupVersion}}')" = 2
          docker version --format 'Docker server {{.Server.Version}} on {{.Server.Os}}/{{.Server.Arch}}'
          uname -r

          probe="inframeld-parser-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          image="$probe:local"
          profile=inframeld-parser-probe
          policy=apps/parser/security/apparmor.profile
          container_ids() {
            timeout 10s docker ps -aq --filter "name=^/$probe$"
          }
          image_ids() {
            timeout 10s docker image ls -q "$image"
          }
          profile_entries() {
            local entries
            entries="$(timeout 10s sudo -n cat /sys/kernel/security/apparmor/profiles)" || return 1
            grep -E "^${profile} " <<< "$entries" || test "$?" = 1
          }
          remaining="$(container_ids)"
          test -z "$remaining"
          remaining="$(image_ids)"
          test -z "$remaining"
          remaining="$(profile_entries)"
          test -z "$remaining"

          scratch="$(mktemp -d "$RUNNER_TEMP/parser-sandbox.XXXXXXXX")"
          trace_dir=""
          cleanup() {
            local result=$? clean=0 owned
            trap - EXIT
            set +e
            owned="$(container_ids)" || clean=1
            if [[ -n "$owned" ]]; then
              printf 'Parser probe required emergency container removal.\n' >&2
              timeout 10s docker rm --force "$probe" >/dev/null || clean=1
              result=1
            fi
            owned="$(image_ids)" || clean=1
            if [[ -n "$owned" ]]; then
              timeout 10s docker image rm "$image" >/dev/null || clean=1
            fi
            owned="$(profile_entries)" || clean=1
            if [[ -n "$owned" ]]; then
              timeout 10s sudo -n apparmor_parser --skip-cache --remove "$policy" || clean=1
            fi
            owned="$(container_ids)" && test -z "$owned" || clean=1
            owned="$(image_ids)" && test -z "$owned" || clean=1
            owned="$(profile_entries)" && test -z "$owned" || clean=1
            if [[ -n "$trace_dir" ]]; then
              timeout 10s sudo -n rmdir -- "$trace_dir" || clean=1
              timeout 10s sudo -n test ! -e "$trace_dir" || clean=1
            fi
            rm -rf -- "$scratch" && test ! -e "$scratch" || clean=1
            if (( clean )); then
              printf 'Parser probe cleanup could not be confirmed.\n' >&2
              exit 1
            fi
            printf 'Parser probe container, image tag, AppArmor profile, scratch and trace instance are absent.\n'
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          mkdir "$scratch/sources"
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            --max-time 45 --max-filesize 262144 \
            --output "$scratch/sources/bubblewrap-0.13.1.tar.xz" \
            https://github.com/containers/bubblewrap/releases/download/v0.13.1/bubblewrap-0.13.1.tar.xz
          curl --proto '=https' --proto-redir '=https' --fail --silent --show-error --location \
            --max-time 45 --max-filesize 262144 --output "$scratch/moby-seccomp.json" \
            https://raw.githubusercontent.com/moby/moby/v28.0.4/profiles/seccomp/default.json
          echo "0e85c8702248b8dd64144f594147553650cdd0e4c951690345faace79c217c4d  $scratch/sources/bubblewrap-0.13.1.tar.xz" | sha256sum --check
          python3 -IB - "$scratch" <<'PY'
          import json
          import runpy
          import sys
          from pathlib import Path

          scratch = Path(sys.argv[1])
          delta = json.loads(Path("apps/parser/security/oci-seccomp.json").read_bytes())
          compose = runpy.run_path("apps/parser/tests/test_sandbox_boundaries.py")["compose_oci_profile"]
          policy = compose((scratch / "moby-seccomp.json").read_bytes(), delta)
          (scratch / "oci-seccomp.json").write_text(json.dumps(policy))
          PY
          sha256sum "$policy" "$scratch/oci-seccomp.json" apps/parser/security/child-seccomp.c
          timeout --kill-after=5s 300s docker buildx build --platform linux/amd64 --load --no-cache \
            --build-context "parser_sources=$scratch/sources" --tag "$image" \
            --file apps/parser/Dockerfile .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$image")" = linux/amd64
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          printf 'Parser probe image %s\n' "$image_id"

          timeout 10s sudo -n apparmor_parser --skip-cache --add "$policy"
          test "$(profile_entries)" = "$profile (enforce)"
          trace_root=/sys/kernel/tracing
          if ! timeout 10s sudo -n test -d "$trace_root/instances"; then
            trace_root=/sys/kernel/debug/tracing
          fi
          trace_target="$trace_root/instances/$probe"
          timeout 10s sudo -n mkdir -- "$trace_target"
          trace_dir="$trace_target"
          trace_write() {
            printf '%s\n' "$1" | timeout 10s sudo -n tee "$trace_dir/$2" >/dev/null
          }
          trace_write 0 tracing_on
          trace_write global trace_clock
          trace_write 128 buffer_size_kb
          # Keep only relevant executable loads and Bubblewrap process relationships.
          trace_write 'filename == "/usr/bin/true" || filename == "/usr/local/bin/python" || filename == "/opt/probe-tools/bwrap"' \
            events/sched/sched_process_exec/filter
          trace_write 'parent_comm == "bwrap"' events/sched/sched_process_fork/filter
          trace_write 'ret < 0' events/syscalls/sys_exit_execve/filter
          trace_write 1 events/sched/sched_process_exec/enable
          trace_write 1 events/sched/sched_process_fork/enable
          trace_write 1 events/syscalls/sys_enter_execve/enable
          trace_write 1 events/syscalls/sys_exit_execve/enable
          trace_write 'id == 1 || id == 20 || id == 60 || id == 231' events/raw_syscalls/sys_enter/filter
          trace_write 'ret < 0 || id == 1 || id == 20' events/raw_syscalls/sys_exit/filter
          trace_write 'comm ~ "python*"' events/signal/signal_generate/filter
          trace_write 'comm ~ "python*"' events/sched/sched_process_exit/filter
          trace_write 1 events/raw_syscalls/sys_enter/enable
          trace_write 1 events/raw_syscalls/sys_exit/enable
          trace_write 1 events/signal/signal_generate/enable
          trace_write 1 events/signal/signal_deliver/enable
          trace_write 1 events/sched/sched_process_exit/enable
          trace_write 1 tracing_on
          (exec /usr/bin/true) &
          trace_control=$!
          wait "$trace_control"
          # Verify error, output, signal and exit visibility independently of the sandbox.
          syscall_header=/usr/include/x86_64-linux-gnu/asm/unistd_64.h
          test -r "$syscall_header"
          (exec /usr/bin/python3 -IB -c '
          import errno
          import os
          import signal

          try:
              os.close(-1)
          except OSError as failure:
              assert failure.errno == errno.EBADF
          else:
              raise AssertionError("Invalid descriptor unexpectedly closed")
          assert os.write(1, b"x") == 1
          signal.signal(signal.SIGUSR1, lambda *_: None)
          signal.raise_signal(signal.SIGUSR1)
          ') >/dev/null &
          startup_control=$!
          wait "$startup_control"

          audit_since="$(date --utc '+%Y-%m-%d %H:%M:%S.%6N UTC')"
          result=0
          timeout --kill-after=5s 620s docker run --rm --pull=never --name "$probe" \
            --network none --read-only --cap-drop ALL --security-opt no-new-privileges \
            --security-opt "apparmor=$profile" --security-opt "seccomp=$scratch/oci-seccomp.json" \
            --cpus 2 --memory 8g --memory-swap=8g --pids-limit 128 --log-driver none \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1g,mode=1777 "$image_id" -k test_python_starts_with_fixed_policy || result=$?
          trace_result=0
          trace_write 0 tracing_on && (
            umask 077
            timeout 10s sudo -n head -c 524289 "$trace_dir/trace" > "$scratch/exec.trace"
          ) && python3 -IB - "$scratch/exec.trace" "$trace_control" "$startup_control" "$scratch/startup.pid" "$syscall_header" <<'TRACE' || trace_result=$?
          import errno
          import re
          import signal
          from itertools import groupby
          import sys
          from pathlib import Path

          capture = Path(sys.argv[1]).read_bytes()
          if len(capture) > 524288:
              raise SystemExit("Kernel exec trace: capture exceeded its bound.")
          source = capture.decode("ascii")
          counts = re.search(r"entries-in-buffer/entries-written:\s*(\d+)/(\d+)", source)
          entries = []
          for line in source.splitlines():
              if not line.strip() or line.startswith("#"):
                  continue
              event = re.fullmatch(r"\s*.+?-(\d+)\s+\[\d+\]\s+.*?\d+\.\d+:\s+(.+)", line)
              if event is None:
                  raise SystemExit("Kernel exec trace: event format was unrecognized.")
              entries.append((int(event[1]), event[2]))
          if counts is None or int(counts[1]) != len(entries) or counts[1] != counts[2]:
              raise SystemExit("Kernel exec trace: the trace was incomplete.")

          def loaded(event, executable):
              return event.startswith(f"sched_process_exec: filename={executable} ")

          def entering(event):
              return event.startswith(("sys_execve(", "execve("))

          control = int(sys.argv[2])
          control_events = [event for pid, event in entries if pid == control]
          if not any(map(entering, control_events)) or not any(
              loaded(event, "/usr/bin/true") for event in control_events
          ):
              raise SystemExit("Kernel exec trace: the known launch was not observed.")

          def startup_events(entries, pid, numbers):
              pending = {}
              startup = []
              ended = False
              for actor, event in entries:
                  if target := re.match(r"signal_generate: sig=(\d+) errno=-?\d+ code=(-?\d+) comm=\S+ pid=(\d+).* res=0$", event):
                      if int(target[3]) == pid:
                          startup.append(f"{signal_name(int(target[1]))} queued (code {target[2]})")
                  if actor != pid:
                      continue
                  if received := re.match(r"signal_deliver: sig=(\d+) errno=-?\d+ code=(-?\d+) ", event):
                      startup.append(f"{signal_name(int(received[1]))} delivered (code {received[2]})")
                  if call := re.fullmatch(r"sys_enter: NR (\d+) \(([0-9a-f]+), .*\)", event):
                      number, argument = int(call[1]), int(call[2], 16)
                      if number in (60, 231):
                          startup.append(f"{numbers[number]}({argument & 255})")
                      else:
                          pending[number] = argument
                  if returned := re.fullmatch(r"sys_exit: NR (-?\d+) = (-?\d+)", event):
                      number, status = int(returned[1]), int(returned[2])
                      argument = pending.pop(number, None)
                      name = numbers.get(number, f"syscall_{number}")
                      if argument is not None and number in (1, 20):
                          name += f"(fd={argument})"
                      outcome = errno.errorcode.get(-status, str(status)) if status < 0 else str(status)
                      startup.append(f"{name} -> {outcome}")
                  if event.startswith("sched_process_exit: "):
                      ended = True
                      break
              return startup, ended


          def signal_name(number):
              try:
                  return signal.Signals(number).name
              except ValueError:
                  return f"signal_{number}"


          syscall_header = Path(sys.argv[5])
          numbers = {
              int(number): name
              for name, number in re.findall(r"^#define __NR_(\w+) (\d+)$", syscall_header.read_text(), re.M)
          }
          if any(numbers.get(number) != name for number, name in ((1, "write"), (20, "writev"), (60, "exit"), (231, "exit_group"))):
              raise SystemExit("Kernel startup trace: syscall table does not match amd64.")

          startup_control = int(sys.argv[3])
          control_startup, control_exited = startup_events(entries, startup_control, numbers)
          if not (control_exited and {"write(fd=1) -> 1", "close -> EBADF"}.issubset(control_startup) and any(event.startswith("SIGUSR1 delivered ") for event in control_startup)):
              raise SystemExit("Kernel startup trace: syscall, exit or signal control was not observed.")

          python = "/usr/local/bin/python"
          if not any(loaded(event, python) for _, event in entries):
              raise SystemExit("Kernel exec trace: the outer Python launch was not observed.")
          roots = [
              (index, pid)
              for index, (pid, event) in enumerate(entries)
              if loaded(event, "/opt/probe-tools/bwrap")
          ]
          if not roots:
              print("Kernel exec trace: Bubblewrap executable load was not observed.")
          elif len(roots) != 1:
              raise SystemExit("Kernel exec trace: Bubblewrap process ownership was ambiguous.")
          else:
              index, root = roots[0]
              owned = {root}
              attempts = 0
              rejections = []
              python_loads = []
              for position, (pid, event) in enumerate(entries[index + 1:], index + 1):
                  if pid not in owned:
                      continue
                  if fork := re.match(r"sched_process_fork: .* child_pid=(\d+)$", event):
                      owned.add(int(fork[1]))
                  attempts += entering(event)
                  if loaded(event, python):
                      python_loads.append((position, pid))
                  if failure := re.fullmatch(r"(?:sys_)?execve -> 0x([0-9a-f]+)", event):
                      value = int(failure[1], 16)
                      if (1 << 64) - 4095 <= value < 1 << 64:
                          rejections.append(errno.errorcode.get((1 << 64) - value, "unknown-errno"))
              if python_loads:
                  if len(python_loads) != 1:
                      raise SystemExit("Kernel startup trace: Python process ownership was ambiguous.")
                  position, pid = python_loads[0]
                  Path(sys.argv[4]).write_text(f"{pid}\n")
                  print("Kernel exec trace: Linux loaded Python in the Bubblewrap process tree.")
                  startup, exited = startup_events(entries[position + 1:], pid, numbers)
                  grouped = [(event, sum(1 for _ in repeat)) for event, repeat in groupby(startup)]
                  print(f"Python startup trace: {len(startup)} events, process exit observed={str(exited).lower()}.")
                  for event, count in grouped[-32:]:
                      print(f"Python startup trace: {event}" + (f" (x{count})" if count > 1 else ""))
                  if not exited:
                      raise SystemExit("Kernel startup trace: the Python exit event was not observed.")
              elif attempts == 1 and len(rejections) == 1:
                  print(f"Kernel exec trace: Linux rejected the Bubblewrap exec with {rejections[0]}.")
              elif attempts == 0:
                  print("Kernel exec trace: Bubblewrap loaded without a later exec event in its process tree.")
              else:
                  print("Kernel exec trace: Bubblewrap reached exec without an observed Python load.")
          TRACE
          if (( result == 0 )); then
            exit "$trace_result"
          fi

          # The journal can omit audit events. Report only fixed matching categories.
          startup_pid=""
          if [[ -f "$scratch/startup.pid" ]]; then
            read -r startup_pid < "$scratch/startup.pid"
          fi
          audit="$(timeout --kill-after=1s 9s bash -o pipefail -s "$audit_since" "$startup_pid" <<'AUDIT'
          sudo -n journalctl --boot --since "$1" -n 128 --no-pager --quiet --output=cat \
            --grep 'apparmor="DENIED"' _TRANSPORT=kernel _TRANSPORT=audit 2>/dev/null |
            LC_ALL=C awk -v startup_pid="$2" '
              !/(^|[[:space:]])apparmor="DENIED"([[:space:]]|$)/ ||
              !/(^|[[:space:]])profile="inframeld-parser-probe"([[:space:]]|$)/ { next }
              startup_pid != "" && $0 ~ ("(^|[[:space:]])pid=" startup_pid "([[:space:]]|$)") {
                if (/ operation="file_inherit"/) inherited = 1
                if (/ operation="(open|file_mmap)"/) startup_file = 1
                if (/ info="Failed name lookup - disconnected path"/) startup_disconnected = 1
                next
              }
              !/(^|[[:space:]])comm="bwrap"([[:space:]]|$)/ { next }
              / name="\/?proc\/([[:digit:]]+|self|thread-self)\/uid_map"([[:space:]]|$)/ { uid = 1 }
              / name="\/?proc\/([[:digit:]]+|self|thread-self)\/gid_map"([[:space:]]|$)/ { gid = 1 }
              / name="\/?proc\/([[:digit:]]+|self|thread-self)\/setgroups"([[:space:]]|$)/ { groups = 1 }
              / name="\/?(proc|oldroot\/proc)\/?"([[:space:]]|$)/ { proc_open = 1 }
              / name="\/?(oldroot|newroot|tmp\/(oldroot|newroot))(\/[^"]*)?"([[:space:]]|$)/ { setup_path = 1 }
              / operation="(mount|umount|pivotroot)"([[:space:]]|$)/ { mount = 1 }
              / info="Failed name lookup - disconnected path"([[:space:]]|$)/ { disconnected = 1 }
              / operation="capable"([[:space:]]|$)/ { capability = 1 }
              END {
                if (inherited) print "Python startup audit: inherited-file-denied"
                if (startup_file) print "Python startup audit: startup-file-denied"
                if (startup_disconnected) print "Python startup audit: disconnected-path"
                if (uid) print "Parser probe kernel audit: uid-map-denied"
                if (gid) print "Parser probe kernel audit: gid-map-denied"
                if (groups) print "Parser probe kernel audit: setgroups-denied"
                if (proc_open) print "Parser probe kernel audit: setup-proc-denied"
                if (setup_path) print "Parser probe kernel audit: setup-path-denied"
                if (mount) print "Parser probe kernel audit: mount-denied"
                if (disconnected) print "Parser probe kernel audit: disconnected-path-denied"
                if (capability) print "Parser probe kernel audit: capability-denied"
              }
            '
          AUDIT
          )" || audit=""
          printf '%s\n' "${audit:-Parser probe kernel audit: unknown}"
          exit "$result"
