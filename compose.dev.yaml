x-provider-lifetimes: &provider-lifetimes
  TTL_ACCESS_TOKEN: ${TTL_ACCESS_TOKEN:-5m}
  TTL_REFRESH_TOKEN: ${TTL_REFRESH_TOKEN:-168h}
  TTL_AUTH_CODE: ${TTL_AUTH_CODE:-1m}
  SESSION_LIFESPAN: ${SESSION_LIFESPAN:-8h}

x-oauth-settings: &oauth-settings
  <<: *provider-lifetimes
  INFRAMELD_HYDRA__ADMIN_URL: http://hydra:4445
  INFRAMELD_HYDRA__PUBLIC_URL: http://127.0.0.1:14444
  INFRAMELD_HYDRA__ISSUER: http://127.0.0.1:14444/
  INFRAMELD_HYDRA__API_AUDIENCE: http://127.0.0.1:8001

x-backend-image: &backend-image
  image: localhost/inframeld-backend:dev
  pull_policy: never
  build:
    context: .
    dockerfile: apps/backend/Dockerfile

services:
  identity-config-check:
    <<: *backend-image
    command:
      [
        "python",
        "-m",
        "inframeld_backend.provision_oauth_client",
        "--validate-only",
      ]
    environment: *oauth-settings

  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: inframeld
      POSTGRES_USER: inframeld
      POSTGRES_PASSWORD: inframeld-dev-only
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - inframeld_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inframeld -d inframeld"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  kratos-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: kratos_dev
      POSTGRES_USER: kratos_dev
      POSTGRES_PASSWORD: kratos-dev-only
    volumes:
      - inframeld_kratos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos_dev -d kratos_dev"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  kratos-migrate:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    command:
      [
        "-c",
        "/etc/config/kratos/dev.yaml",
        "migrate",
        "sql",
        "up",
        "-e",
        "--yes",
      ]
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-postgres:
        condition: service_healthy

  mailpit:
    image: docker.io/axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_TLS_CERT: sans:mailpit
      MP_SMTP_TLS_KEY: sans:mailpit
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    ports:
      - "127.0.0.1:18024:8025"

  kratos:
    image: docker.io/oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    # Optional company sign-in: follow apps/backend/README.md to create the
    # Git-ignored config/kratos/dev.local.yaml and register the OIDC callback.
    # Comment out the default command and uncomment the local-config command.
    command:
      ["serve", "-c", "/etc/config/kratos/dev.yaml", "--dev", "--watch-courier"]
    # command:
    #   ["serve", "-c", "/etc/config/kratos/dev.local.yaml", "--dev", "--watch-courier"]
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    environment:
      <<: *provider-lifetimes
      OAUTH2_PROVIDER_URL: http://hydra:4445
      SELFSERVICE_FLOWS_LOGIN_UI_URL:
    ports:
      - "127.0.0.1:14434:4433"
    depends_on:
      identity-config-check:
        condition: service_completed_successfully
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  hydra-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: hydra_dev
      POSTGRES_USER: hydra_dev
      POSTGRES_PASSWORD: hydra-dev-only
    volumes:
      - inframeld_hydra_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra_dev -d hydra_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment:
      DSN: postgres://hydra_dev:hydra-dev-only@hydra-postgres:5432/hydra_dev?sslmode=disable
    depends_on:
      identity-config-check:
        condition: service_completed_successfully
      hydra-postgres:
        condition: service_healthy

  hydra:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command:
      [
        "serve",
        "all",
        "--dev",
        "--sqa-opt-out",
        "-c",
        "/etc/config/hydra/dev.yaml",
      ]
    environment:
      <<: *provider-lifetimes
      DSN: postgres://hydra_dev:hydra-dev-only@hydra-postgres:5432/hydra_dev?sslmode=disable
      # Development-only server secrets, distinct from every other service.
      SECRETS_SYSTEM: INFRAMELD-HYDRA-DEV-ONLY-SYSTEM-12345678
      SECRETS_COOKIE: INFRAMELD-HYDRA-DEV-ONLY-COOKIE-12345678
      URLS_CONSENT:
      TTL_ID_TOKEN:
      TTL_LOGIN_CONSENT_REQUEST:
      TTL_AUTHENTICATION_SESSION:
    volumes:
      - ./config/hydra/dev.yaml:/etc/config/hydra/dev.yaml:ro
    ports:
      - "127.0.0.1:14444:4444"
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  oauth-client-setup:
    <<: *backend-image
    command: ["python", "-m", "inframeld_backend.provision_oauth_client"]
    environment: *oauth-settings
    depends_on:
      hydra:
        condition: service_started

  recovery-callbacks:
    <<: *backend-image
    profiles: [recovery]
    command:
      [
        "uvicorn",
        "inframeld_backend.recovery_main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8081",
        "--no-access-log",
      ]
    environment:
      INFRAMELD_DATABASE__HOST: postgres
      INFRAMELD_DATABASE__PORT: "5432"
      INFRAMELD_DATABASE__NAME: inframeld
      INFRAMELD_DATABASE__USER: inframeld
      INFRAMELD_DATABASE__PASSWORD: inframeld-dev-only
      INFRAMELD_RECOVERY__AUTHORITY: kratos:local
      INFRAMELD_RECOVERY__CURRENT_KEY_FILE: /run/secrets/recovery_hook_key
    secrets:
      - recovery_hook_key
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-image
    environment:
      <<: *oauth-settings
      INFRAMELD_ENVIRONMENT: local
      INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE: /run/secrets/idempotency_fingerprint_hmac
      INFRAMELD_DATABASE__HOST: postgres
      INFRAMELD_DATABASE__PORT: "5432"
      INFRAMELD_DATABASE__NAME: inframeld
      INFRAMELD_DATABASE__USER: inframeld
      INFRAMELD_DATABASE__PASSWORD: inframeld-dev-only
      INFRAMELD_KRATOS__PUBLIC_URL: http://kratos:4433
      INFRAMELD_KRATOS__AUTHORITY: kratos:local
      INFRAMELD_KRATOS__ADMIN_URL: http://kratos:4434
      INFRAMELD_CSRF__TRUSTED_ORIGINS: '["http://127.0.0.1:8001"]'
    secrets:
      - idempotency_fingerprint_hmac
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      oauth-client-setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kratos:
        condition: service_started

volumes:
  inframeld_postgres_data:
  inframeld_kratos_postgres_data:
  inframeld_hydra_postgres_data:

secrets:
  recovery_hook_key:
    file: ${INFRAMELD_RECOVERY_KEY_HOST_FILE:-/etc/inframeld/secrets/recovery_hook.key}
  idempotency_fingerprint_hmac:
    file: ${INFRAMELD_FINGERPRINT_KEY_HOST_FILE:-/etc/inframeld/secrets/idempotency_fingerprint_hmac.key}
