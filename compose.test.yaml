name: inframeld-test

services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: inframeld_test
      POSTGRES_USER: inframeld_test
      POSTGRES_PASSWORD: inframeld-test-only
    volumes:
      - inframeld_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inframeld_test -d inframeld_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  kratos-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: kratos_test
      POSTGRES_USER: kratos_test
      POSTGRES_PASSWORD: kratos-test-only
    volumes:
      - inframeld_test_kratos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kratos_test -d kratos_test"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  kratos-migrate:
    image: docker.io/oryd/kratos:v25.4.0
    command:
      [
        "-c",
        "/etc/config/kratos/test.yaml",
        "migrate",
        "sql",
        "up",
        "-e",
        "--yes",
      ]
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    depends_on:
      kratos-postgres:
        condition: service_healthy
  mailpit:
    image: docker.io/axllent/mailpit:v1.31.1
    environment:
      MP_SMTP_TLS_CERT: sans:mailpit
      MP_SMTP_TLS_KEY: sans:mailpit
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
  kratos:
    image: docker.io/oryd/kratos:v25.4.0
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    command:
      [
        "serve",
        "-c",
        "/etc/config/kratos/test.yaml",
        "--dev",
        "--watch-courier",
      ]
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  mock-oidc:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.2
    environment:
      JSON_CONFIG: >-
        {
          "interactiveLogin": false,
          "tokenCallbacks": [
            {
              "issuerId": "inframeld",
              "requestMappings": [
                {
                  "requestParam": "code",
                  "match": "*",
                  "claims": {
                    "sub": "oidc-$${code}",
                    "email": "oidc-$${code}@example.test",
                    "email_verified": true,
                    "groups": ["administrators"],
                    "aud": ["inframeld-kratos-test"]
                  }
                }
              ]
            }
          ]
        }

  kratos-expiring:
    image: docker.io/oryd/kratos:v25.4.0
    volumes:
      - ./config/kratos:/etc/config/kratos:ro
    command:
      - serve
      - -c
      - /etc/config/kratos/test.yaml
      - -c
      - /etc/config/kratos/test-expiring.yaml
      - --dev
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully

  hydra-postgres:
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_DB: hydra_test
      POSTGRES_USER: hydra_test
      POSTGRES_PASSWORD: hydra-test-only
    # Ephemeral, test-only database. No host ports or persistent volume.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydra_test -d hydra_test"]
      interval: 2s
      timeout: 5s
      retries: 30

  hydra-migrate:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command: ["migrate", "sql", "up", "-e", "--yes"]
    environment:
      DSN: postgres://hydra_test:hydra-test-only@hydra-postgres:5432/hydra_test?sslmode=disable
    depends_on:
      hydra-postgres:
        condition: service_healthy

  hydra:
    image: docker.io/oryd/hydra:v26.2.0@sha256:ff67c7fb5f95074fa53374d41151713554960504b340cd3f95b09e65deaea2a9
    command:
      [
        "serve",
        "all",
        "--dev",
        "--sqa-opt-out",
        "-c",
        "/etc/config/hydra/test.yaml",
      ]
    volumes:
      - ./config/hydra/test.yaml:/etc/config/hydra/test.yaml:ro
    depends_on:
      hydra-migrate:
        condition: service_completed_successfully

  integration-tests:
    image: ${INFRAMELD_INTEGRATION_IMAGE:-localhost/inframeld-integration-tests:local}
    pull_policy: never
    build:
      context: .
      dockerfile: apps/backend/Dockerfile.integration
    environment:
      INFRAMELD_ENVIRONMENT: test
      INFRAMELD_RUN_DB_INTEGRATION: "1"
      INFRAMELD_RUN_KRATOS_INTEGRATION: "1"
      INFRAMELD_RUN_HYDRA_INTEGRATION: "1"
      INFRAMELD_DATABASE__HOST: postgres
      INFRAMELD_DATABASE__PORT: "5432"
      INFRAMELD_KRATOS__PUBLIC_URL: http://kratos:4433
      INFRAMELD_DATABASE__NAME: inframeld_test
      INFRAMELD_DATABASE__USER: inframeld_test
      INFRAMELD_DATABASE__PASSWORD: inframeld-test-only
      INFRAMELD_REQUEST_FINGERPRINT__KEY_FILE: /tmp/fingerprint.key
    volumes:
      - ./apps/backend/src:/workspace/apps/backend/src:ro
      - ./apps/backend/tests:/workspace/apps/backend/tests:ro
      - ./apps/backend/migrations:/workspace/apps/backend/migrations:ro
      - ./apps/backend/alembic.ini:/workspace/apps/backend/alembic.ini:ro
      - ./apps/backend/.env.test.example:/workspace/apps/backend/.env.test:ro
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["python", "-m", "tests.support.integration_runner"]
    command: ["tests/integration"]

volumes:
  inframeld_test_postgres_data:
    name: inframeld_test_postgres_data
  inframeld_test_kratos_postgres_data:
    name: inframeld_test_kratos_postgres_data
